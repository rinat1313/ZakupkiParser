# Совместный запуск ZakupkiParser + analizator_zakupok + PostgreSQL.
#
# Требования:
#   - Docker Compose v2
#   - LM Studio Local Server на хосте (порт 1234) с загруженной моделью
#
# Запуск:
#   docker compose up -d --build
#
# Парсер (пример):
#   docker compose run --rm parser -limit 1 -analyze-url http://analizator:8088
#
# Анализ уже выгруженного тендера:
#   curl -X POST http://127.0.0.1:8088/api/v1/analyze \
#     -H 'Content-Type: application/json' \
#     -d '{"reg_number":"0334500000125000001"}'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zakupki
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./analizator_zakupok/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 10

  analizator:
    build:
      context: ./analizator_zakupok
    ports:
      - "8088:8088"
    environment:
      HTTP_ADDR: ":8088"
      TENDERS_ROOT: /data/tenders
      CHECKLISTS_DIR: /app/configs/checklists
      DEFAULT_CHECKLIST: default
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki?sslmode=disable
      CHUNK_SIZE: "3500"
      CHUNK_OVERLAP: "250"
      MAX_CHUNKS: "40"
      CONCURRENCY: "2"
    volumes:
      - ./DataCode/result:/data/tenders
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Опциональный one-shot парсер (образ собирается из DataCode).
  parser:
    build:
      context: ./DataCode
      dockerfile: Dockerfile
    profiles: ["parser"]
    environment:
      EIS_INSECURE: "1"
    volumes:
      - ./DataCode/result:/app/result
      - ./DataCode/data:/app/data:ro
    depends_on:
      - analizator
    entrypoint: ["/app/parser"]
    command: ["-result", "/app/result", "-analyze-url", "http://analizator:8088"]

volumes:
  pgdata:
