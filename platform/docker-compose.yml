services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
      POSTGRES_DB: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: platform/api/Dockerfile
    environment:
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
