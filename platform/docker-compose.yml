services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zakupki
      POSTGRES_PASSWORD: zakupki
      POSTGRES_DB: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zakupki -d zakupki"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: platform/api/Dockerfile
    environment:
      DATABASE_URL: postgres://zakupki:zakupki@postgres:5432/zakupki?sslmode=disable
      HTTP_ADDR: ":8080"
      # Мост к analizator_zakupok (профиль ai). Без профиля — disabled.
      ANALIZATOR_URL: ${ANALIZATOR_URL:-http://analizator:8088}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  # Опционально: AI-анализ через LM Studio.
  # Нужен соседний клон https://github.com/rinat1313/analizator_zakupok
  # или ANALIZATOR_PATH=/path/to/analizator_zakupok
  #
  #   export LM_STUDIO_MODEL=<id>
  #   docker compose --profile ai up -d --build
  analizator:
    profiles: ["ai"]
    build:
      context: ${ANALIZATOR_PATH:-../../analizator_zakupok}
    ports:
      - "8088:8088"
    environment:
      HTTP_ADDR: ":8088"
      TENDERS_ROOT: /data/tenders
      CHECKLISTS_DIR: /app/configs/checklists
      PROMPTS_DIR: /app/configs/prompts
      DEFAULT_CHECKLIST: ${DEFAULT_CHECKLIST:-default}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - analizator_tenders:/data/tenders

volumes:
  pgdata:
  analizator_tenders:
